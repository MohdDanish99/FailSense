services:
  - type: web
    name: failsense
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && python train.py
    startCommand: python server.py --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PDM_API_KEY
        generateValue: true
      - key: PDM_DEMO_MACHINES
        value: "6"
